name: Build obsidian plugin

on:
  push:
    tags:
      - '*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: yarn
      - name: Cache Obsidian test runtimes
        uses: actions/cache@v5
        with:
          path: .obsidian-cache
          key: obsidian-${{ runner.os }}-${{ runner.arch }}-1.13.7-1.12.4-1.0.3-earliest-${{ hashFiles('yarn.lock') }}
      - name: Install desktop test dependencies
        run: sudo apt-get update && sudo apt-get install --yes xvfb herbstluftwm
      - name: Build
        id: build
        env:
          OBSIDIAN_VERSIONS: 1.13.7/1.12.4 1.0.3/earliest
        run: |
          npx --yes --package=yarn@1.22.22 yarn install --frozen-lockfile --non-interactive
          npm run lint
          npm test
          node -e 'const p = require("./package.json"); const m = require("./manifest.json"); if (p.version !== m.version || m.version !== process.env.GITHUB_REF_NAME) throw new Error("Release version mismatch");'
          npm run build --if-present
          xvfb-run --auto-servernum --server-args="-screen 0 1440x900x24" sh -c 'herbstluftwm & npm run test:e2e:run'
      - name: Upload E2E failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: e2e-results/
          if-no-files-found: ignore
      - name: Attest release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/main.js
            manifest.json
      - name: Prepare release notes
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > release-notes.md
      - name: Create release with changelog notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/main.js \
            manifest.json \
            --notes-file release-notes.md \
            --verify-tag
